# Proje konfigürasyonu — Phase 2'den itibaren data_generator tarafından okunuyor.

random_seed: 42

dataset:
  size: small          # small | medium | large
  horizon_hours: 168    # planlama ufku: 7 gün (168 saat) — Machine.available_until, EnergyPrice ufku bunu kullanır
  presets:
    small:
      machines: 10
      jobs: 50
    medium:
      machines: 20
      jobs: 250
    large:
      machines: 50
      jobs: 1000

optimization:
  solver: highs         # highs | gurobi
  time_limit_seconds: 300
  big_m: 336             # 2 x horizon_hours (bkz. docs/mathematical-model.md Bölüm 5)
  objective_weights:     # Gerekçe: docs/mathematical-model.md Bölüm 6.4 — varsayılan ($/saat) katsayılar, Phase 19-20'de duyarlılık analizi yapılacak
    production_time: 50   # c_time: $/saat (üretim süresi maliyeti)
    energy_cost: 1        # zaten $ cinsinden, dönüşüm gerekmiyor
    tardiness: 100         # c_tardy: $/saat (gecikme cezası)

database:
  url: "sqlite:///./data/factory.db"

api:
  host: "127.0.0.1"
  port: 8000
