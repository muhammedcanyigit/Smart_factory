# Proje konfigürasyonu — Phase 2'den itibaren data_generator tarafından okunuyor.

random_seed: 42

dataset:
  size: small          # small | medium | large
  horizon_hours: 168    # planlama ufku: 7 gün (168 saat) — Machine.available_until, EnergyPrice ufku bunu kullanır
  presets:
    small:
      machines: 10
      jobs: 50
    medium:
      machines: 20
      jobs: 250
    large:
      machines: 50
      jobs: 1000

optimization:
  # NOT: bu alan şu an sadece dokümantasyon amaçlı — hiçbir kod bu alanı
  # okumuyor. Gerçek solver seçimi optimization/native_solver.py'ye doğrudan
  # gömülü (gurobipy). Bkz. docs/decision-log.md "Solver Değişikliği: HiGHS -> Gurobi".
  solver: gurobi         # gurobi (aktif, 2026-09-18'den itibaren) | highs (devre dışı, yedek)
  time_limit_seconds: 300
  big_m: 168             # = horizon_hours; ispatlanabilir güvenli minimum (bkz. docs/mathematical-model.md Bölüm 5, Phase 8 revizyonu). Önceki değer 336 idi.
  objective_weights:     # Gerekçe: docs/mathematical-model.md Bölüm 6.4 — varsayılan ($/saat) katsayılar, Phase 19-20'de duyarlılık analizi yapılacak
    production_time: 50   # c_time: $/saat (üretim süresi maliyeti)
    energy_cost: 1        # zaten $ cinsinden, dönüşüm gerekmiyor
    tardiness: 100         # c_tardy: $/saat (gecikme cezası)
